# Smite Plugin Configuration
# High-performance ability system for Paper 1.21.11
# Version: 1.0 by SunMC

# ====================================
# CELL CONFIGURATION
# ====================================
cells:
  spark_cell:
    enabled: true
    display_name: "Spark Cell"
    description: "Harness the power of lightning and darkness"
    icon_material: "NETHER_STAR"
    abilities:
      - "heavenly_smite"
      - "demonic_spark"

  # Add more cells here in the future
  # frost_cell:
  #   enabled: false
  #   display_name: "Frost Cell"
  #   description: "Control ice and freeze your enemies"
  #   icon_material: "ICE"
  #   abilities:
  #     - "ice_shard"
  #     - "frozen_heart"

# ====================================
# ABILITY CONFIGURATION
# ====================================
abilities:
  heavenly_smite:
    enabled: true
    cooldown: 45  # seconds
    damage: 10.0  # 5 hearts
    required_crits: 3
    crit_chain_timeout: 3000  # milliseconds
    default_keybind: "KEY_R"

  demonic_spark:
    enabled: true
    cooldown: 45  # seconds
    duration: 5  # seconds to store damage
    default_keybind: "KEY_F"

# ====================================
# PARTICLE CONFIGURATION
# ====================================
particles:
  # Use packet-based particles for better performance
  use_packets: true
  # Maximum particle distance (blocks)
  max_distance: 64
  # Particle quality (LOW, MEDIUM, HIGH)
  quality: "HIGH"

# ====================================
# GUI CONFIGURATION
# ====================================
gui:
  # Use packet-based GUIs
  use_packets: true
  # Cell selection GUI settings
  cell_selection:
    title: "Select Your Cell"
    rows: 3
    # Show confirmation GUI before locking cell
    require_confirmation: true
  # Confirmation GUI settings
  confirmation:
    title: "Confirm Cell Selection"
    warning_message: "This choice is PERMANENT!"

# ====================================
# KEYBIND CONFIGURATION
# ====================================
keybinds:
  # Enable keybind system
  enabled: true
  # Default keybinds for abilities
  defaults:
    ability_1: "KEY_R"
    ability_2: "KEY_F"
  # Keybind detection debounce time (ms)
  debounce_time: 300

# ====================================
# DATABASE CONFIGURATION
# ====================================
database:
  # Database file name
  file: "smite.db"
  # Auto-save interval (seconds, 0 = disable)
  auto_save_interval: 300
  # Enable database backups
  enable_backups: true
  # Maximum number of backups to keep
  max_backups: 5

# ====================================
# PERFORMANCE CONFIGURATION
# ====================================
performance:
  # Use async processing when possible
  async_processing: true
  # Thread pool size for async tasks
  thread_pool_size: 4
  # Cache player data in memory
  cache_player_data: true
  # Cache timeout (seconds)
  cache_timeout: 600

# ====================================
# MESSAGES CONFIGURATION
# ====================================
messages:
  # Prefix for all plugin messages
  prefix: "&6[Smite] &r"
  # Welcome message for new players
  welcome:
    - ""
    - "&6═══════════════════════════"
    - "  &eWelcome to &6Smite"
    - ""
    - "  &fYou need to select a Cell!"
    - "  &7Use &b/smite select &7to choose"
    - ""
    - "  &c⚠ This choice is PERMANENT!"
    - "&6═══════════════════════════"
    - ""
  # Cell selection messages
  cell_selected: "&aCell selected: &6{cell}"
  cell_already_selected: "&cYou have already selected a cell!"
  # Ability messages
  ability_activated: "&6{ability} &aactivated!"
  ability_on_cooldown: "&c{ability} is on cooldown: &e{time}s"
  ability_not_in_cell: "&cThis ability is not in your cell!"
  # Keybind messages
  keybind_set: "&aKeybind set: &6{ability} &7→ &b{key}"
  invalid_keybind: "&cInvalid keybind! Use KEY_R or KEY_F"

# ====================================
# DEBUG CONFIGURATION
# ====================================
debug:
  # Enable debug mode
  enabled: false
  # Log packet events
  log_packets: false
  # Log database operations
  log_database: false
  # Log ability activations
  log_abilities: false

# Do not change this
config_version: 1
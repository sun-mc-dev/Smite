name: Smite
version: '1.0'
main: me.sunmc.smite.Smite
api-version: '1.21'
authors: [ sunmc ]
description: High-performance ability plugin with packet-based effects
website: https://github.com/sun-mc-dev/Smite

commands:
  smite:
    description: Main command for Smite plugin
    usage: /<command> [list|activate|cooldown|reload|info]
    permission: smite.use
    permission-message: You don't have permission to use this command

permissions:
  smite.use:
    description: Allows use of basic Smite commands
    default: true
  smite.admin:
    description: Allows use of admin Smite commands
    default: op
    children:
      smite.use: true
      smite.reload: true
      smite.cooldown: true
  smite.reload:
    description: Allows reloading the plugin configuration
    default: op
  smite.cooldown:
    description: Allows managing player cooldowns
    default: op
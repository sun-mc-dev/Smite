name: Smite
version: '1.0'
main: me.sunmc.smite.Smite
api-version: '1.21'
authors: [ sunmc ]
description: High-performance ability plugin with packet-based effects
website: https://github.com/sun-mc-dev/Smite

commands:
  smite:
    description: Main Smite command
    usage: |-
      /<command> select - Open cell selection GUI
      /<command> cells - List all available cells
      /<command> list - List all abilities
      /<command> activate <ability> - Manually activate an ability
      /<command> info <ability> - Show ability information
      /<command> keybind <ability> <key> - Set ability keybind
      /<command> cooldown <player> <ability> clear - Clear a cooldown
      /<command> reload - Reload configuration
    permission: smite.use
    aliases: [ sm, abilities ]

permissions:
  smite.use:
    description: Allows basic Smite command usage
    default: true
  smite.admin:
    description: Allows admin commands
    default: op
    children:
      smite.use: true
      smite.reload: true
      smite.cooldown: true
  smite.reload:
    description: Allows reloading the configuration
    default: op
  smite.cooldown:
    description: Allows managing player cooldowns
    default: op